[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumos-host-tools"
dynamic = ["version"]
description = "Host-side toolkit for QuantumOS: MCP server, attested VM bridge (QosVM/QosSociety), Lamport attestation verifier, quantum gateway mirrors, the provider broker, the qos-hub MCP front door, and Sashiko review"
readme = "scripts/README-package.md"
license = "GPL-2.0-only"
requires-python = ">=3.10"
authors = [{ name = "flaukowski" }]
keywords = ["quantumos", "mcp", "agents", "operating-system", "capability-security", "qemu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Operating System Kernels",
    "Topic :: System :: Emulators",
]
# qos_bridge is stdlib-only BY CONTRACT (guest CI has no pip); the mcp dependency
# serves the MCP servers (qos_mcp, broker_mcp, the hub). Keeping it a hard dep because the
# MCP server is the headline. Capped below 2: mcp 2.x renamed FastMCP and the HTTP client,
# and an unpinned install picked 2.3.0, on which `qos-mcp` could not even import.
dependencies = ["mcp>=1.10,<2"]

[project.optional-dependencies]
quantum = ["pennylane>=0.45"]   # qsv_gateway host dispatch
qbraid = ["qbraid"]             # qbraid_boot real-QPU entropy handoff
oci = ["oci>=2.100"]            # the provider broker's OCI plugin (buckets, Always Free VMs)

[project.urls]
Homepage = "https://github.com/kannaka-labs/QuantumOS"
"Live demo" = "https://kannaka-labs.github.io/QuantumOS/"
"Public console" = "https://qos.ninja-portal.com"
Changelog = "https://github.com/kannaka-labs/QuantumOS/blob/main/CHANGELOG.md"

[project.scripts]
qos-mcp = "qos_mcp:main"
qos-verify-attestation = "verify_attestation:main"
qos-qbraid-boot = "qbraid_boot:main"
qos-broker = "quantumos_agent.broker.provider_broker:main"
qos-broker-mcp = "quantumos_agent.broker.broker_mcp:main"
qos-hub = "quantumos_agent.hub.qos_hub:main"
qos-review = "quantumos_agent.review.sashiko_review:main"

[tool.setuptools]
# quantumos_agent's two subpackages are the tools/ directories themselves (no copies): the
# repository keeps running them from tools/, and the wheel ships them as packages.
package-dir = { "" = "scripts", "quantumos_agent.broker" = "tools/provider-broker", "quantumos_agent.hub" = "tools/qos-hub", "quantumos_agent.review" = "tools/sashiko-review" }
packages = ["quantumos_agent", "quantumos_agent.broker", "quantumos_agent.hub", "quantumos_agent.review"]
py-modules = [
    "qos_bridge",
    "qos_mcp",
    "qpu_circuit",
    "qsv_mirror",
    "qsv_gateway",
    "verify_attestation",
    "qbraid_boot",
    "swarm_pingpong",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.package-data]
"quantumos_agent.hub" = ["hub.example.json", "README.md"]
"quantumos_agent.broker" = ["README.md"]
"quantumos_agent.review" = ["review.example.json", "README.md"]
