# Public console launcher (tools/qos-console): one throwaway Firecracker microVM per
# visitor. Tests run against a fake hypervisor, so no KVM is needed in CI.
name: QOS Console

on:
  push:
    branches: [main]
    paths:
      - "tools/qos-console/**"
      - ".github/workflows/qos-console.yml"
  pull_request:
    paths:
      - "tools/qos-console/**"
      - ".github/workflows/qos-console.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "websockets==15.0.1" pytest pytest-asyncio
      - name: Test (resource warnings are errors)
        run: python -m pytest -q -W error::ResourceWarning tools/qos-console
