# Public console launcher (tools/qos-console): one throwaway Firecracker microVM per
# visitor. Tests run against a fake hypervisor, so no KVM is needed in CI.
# Also the host quantum broker (tools/qpu-broker), against a fake qBraid: no key, no spend.
name: QOS Console

on:
  push:
    branches: [main]
    paths:
      - "tools/qos-console/**"
      - "tools/qpu-broker/**"
      - "tools/provider-broker/**"
      - "tools/qos-hub/**"
      - "tools/sashiko-review/**"
      - "scripts/qos_bridge.py"
      - "scripts/qpu_circuit.py"
      - "scripts/quantumos_agent/**"
      - "pyproject.toml"
      - ".github/workflows/qos-console.yml"
  pull_request:
    paths:
      - "tools/qos-console/**"
      - "tools/qpu-broker/**"
      - "tools/provider-broker/**"
      - "tools/qos-hub/**"
      - "tools/sashiko-review/**"
      - "scripts/qos_bridge.py"
      - "scripts/qpu_circuit.py"
      - "scripts/quantumos_agent/**"
      - "pyproject.toml"
      - ".github/workflows/qos-console.yml"

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned, see #346
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "websockets==15.0.1" pytest pytest-asyncio cryptography "mcp==1.28.1" "pydantic==2.13.4" "pydantic-core==2.46.4"
      - name: Test (resource warnings are errors)
        run: python -m pytest -q -W error::ResourceWarning tools/qos-console tools/qpu-broker tools/provider-broker tools/qos-hub tools/sashiko-review
      # The wheel, installed into a clean venv away from the checkout: the installed commands
      # must run, and resolving dependencies fresh (not the pins above) catches a breaking
      # upstream release, as mcp 2.x was for qos-mcp.
      - name: Package (build, install clean, run the installed commands)
        run: |
          pip install build
          python -m build --wheel --outdir /tmp/dist
          python -m venv /tmp/pkg
          /tmp/pkg/bin/pip install -q /tmp/dist/*.whl
          cd /tmp
          /tmp/pkg/bin/python -c "import qos_mcp, quantumos_agent.hub.qos_hub, quantumos_agent.hub.cli_connector, quantumos_agent.broker.provider_broker, quantumos_agent.broker.plugin_oci, quantumos_agent.broker.broker_mcp, quantumos_agent.review.sashiko_review; print('imports ok')"
          /tmp/pkg/bin/qos-hub example | /tmp/pkg/bin/python -c "import json, sys; print(sorted(json.load(sys.stdin)['servers']))"
          /tmp/pkg/bin/qos-broker setup oci | head -1
          /tmp/pkg/bin/qos-review example | /tmp/pkg/bin/python -c "import json, sys; print(json.load(sys.stdin)['provider'])"
          /tmp/pkg/bin/qos-broker envelope --db /tmp/b.db --per-day 1 --per-action 1 --classes storage | tail -1
