# Public console: /etc/nginx/conf.d/qos.conf on O1 (https://qos.ninja-portal.com).
# The same static page and launcher as the staging /qos/ route, without basic auth.
# certbot adds the listen 443 ssl / certificate lines and the http->https server.
# Rate-limit zones are in qos-console-zones.conf (see nginx-qos-console.conf), and the VM
# caps are in the launcher.
server {
    server_name qos.ninja-portal.com;
    client_max_body_size 64k;

    location / {
        limit_req   zone=qos_page burst=20 nodelay;
        root        /usr/share/nginx/html/qos-console;
        index       index.html;
        try_files   $uri $uri/ =404;
        add_header  Cache-Control "no-cache";
    }

    location = /ws {
        limit_req            zone=qos_boot burst=3 nodelay;
        limit_conn           qos_conn 1;
        proxy_pass           http://127.0.0.1:8930/ws;
        proxy_http_version   1.1;
        proxy_set_header     Upgrade $http_upgrade;
        proxy_set_header     Connection "upgrade";
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_read_timeout   700s;
        proxy_send_timeout   700s;
        access_log           /var/log/nginx/qos-console.access.log;
    }

    # Funnel metrics (#258): aggregate JSON (counts and timings only), and the page's two
    # beacons (load, boot). These locations write no access log, so they add no new record
    # of addresses. /metrics (Prometheus) is not proxied; it answers only on the tunnel.
    location = /stats {
        limit_req            zone=qos_page burst=20 nodelay;
        proxy_pass           http://127.0.0.1:8930/stats;
        proxy_http_version   1.1;
        access_log           off;
    }

    location = /beacon {
        limit_req            zone=qos_page burst=20 nodelay;
        proxy_pass           http://127.0.0.1:8930/beacon;
        proxy_http_version   1.1;
        proxy_set_header     X-Real-IP $remote_addr;
        access_log           off;
    }
}
