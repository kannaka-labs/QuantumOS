# --- http{} context: /etc/nginx/conf.d/qos-console-zones.conf -----------------
# limit_req_zone  $binary_remote_addr zone=qos_page:10m rate=5r/s;
# limit_req_zone  $binary_remote_addr zone=qos_boot:10m rate=6r/m;
# limit_conn_zone $binary_remote_addr zone=qos_conn:10m;

# --- inside the staging server{} (staff.ninja-portal.com) ------------------------
# Location-level auth_basic overrides the server's own, so the console has its own
# credentials. The hash file sits beside nginx (nginx cannot read
# /etc/kannaka-secrets, mode 700); the plaintext lives in
# /etc/kannaka-secrets/qos-console.env.

location = /qos { return 301 /qos/; }

location /qos/ {
    auth_basic           "QuantumOS console (staging)";
    auth_basic_user_file /etc/nginx/qos-console.htpasswd;
    limit_req            zone=qos_page burst=20 nodelay;
    alias                /usr/share/nginx/html/qos-console/;
    index                index.html;
    add_header           Cache-Control "no-cache";
}

location = /qos/ws {
    auth_basic           "QuantumOS console (staging)";
    auth_basic_user_file /etc/nginx/qos-console.htpasswd;
    limit_req            zone=qos_boot burst=3 nodelay;
    limit_conn           qos_conn 1;
    proxy_pass           http://127.0.0.1:8930/ws;
    proxy_http_version   1.1;
    proxy_set_header     Upgrade $http_upgrade;
    proxy_set_header     Connection "upgrade";
    proxy_set_header     Host $host;
    proxy_set_header     X-Real-IP $remote_addr;
    proxy_read_timeout   700s;
    proxy_send_timeout   700s;
    access_log           /var/log/nginx/qos-console.access.log;
}

# Funnel metrics (#258): aggregate JSON, and the page's two beacons (load, boot).
# No access log here, so these requests add no new record of addresses.
# /metrics (Prometheus) is deliberately NOT proxied: it answers only on the tunnel.
location = /qos/stats {
    auth_basic           "QuantumOS console (staging)";
    auth_basic_user_file /etc/nginx/qos-console.htpasswd;
    limit_req            zone=qos_page burst=20 nodelay;
    proxy_pass           http://127.0.0.1:8930/stats;
    proxy_http_version   1.1;
    access_log           off;
}

location = /qos/beacon {
    auth_basic           "QuantumOS console (staging)";
    auth_basic_user_file /etc/nginx/qos-console.htpasswd;
    limit_req            zone=qos_page burst=20 nodelay;
    proxy_pass           http://127.0.0.1:8930/beacon;
    proxy_http_version   1.1;
    proxy_set_header     X-Real-IP $remote_addr;
    access_log           off;
}
